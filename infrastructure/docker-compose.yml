name: clinic-copilot

x-db: &db
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  JAVA_TOOL_OPTIONS: -Xmx256m

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: clinic_identity
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d clinic_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"

  api-gateway:
    build: ../backend/api-gateway
    image: ${DOCKERHUB_USER:-clinic}/clinic-api-gateway:1.0
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: -Xmx256m
    ports:
      - "8080:8080"

  frontend:
    build: ../frontend/web-angular
    image: ${DOCKERHUB_USER:-clinic}/clinic-frontend:1.0
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
  identity-profile-service:
    build: ../backend/identity-profile-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-identity-profile-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_identity
    depends_on:
      postgres:
        condition: service_healthy
  doctor-directory-service:
    build: ../backend/doctor-directory-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-doctor-directory-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_doctors
    depends_on:
      postgres:
        condition: service_healthy
  appointment-service:
    build: ../backend/appointment-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-appointment-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_appointments
    depends_on:
      postgres:
        condition: service_healthy
  ai-assessment-service:
    build: ../backend/ai-assessment-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-ai-assessment-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_ai
    depends_on:
      postgres:
        condition: service_healthy
  chat-service:
    build: ../backend/chat-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-chat-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_chat
    depends_on:
      postgres:
        condition: service_healthy
  medical-records-service:
    build: ../backend/medical-records-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-medical-records-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_records
    depends_on:
      postgres:
        condition: service_healthy
  notification-service:
    build: ../backend/notification-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-notification-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_notifications
    depends_on:
      postgres:
        condition: service_healthy
  reviews-feedback-service:
    build: ../backend/reviews-feedback-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-reviews-feedback-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_reviews
    depends_on:
      postgres:
        condition: service_healthy
  admin-audit-service:
    build: ../backend/admin-audit-service
    image: ${DOCKERHUB_USER:-clinic}/clinic-admin-audit-service:1.0
    restart: unless-stopped
    environment:
      <<: *db
      DB_URL: jdbc:postgresql://postgres:5432/clinic_admin
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
