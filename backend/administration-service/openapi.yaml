openapi: 3.0.3
info:
  title: Clinic Copilot - Administration Service
  version: 1.0.0
  description: >
    Configuration plateforme, statistiques agrégées et actions réservées aux administrateurs.
    Aucune donnée clinique ne transite par ce service.
servers:
  - url: http://localhost:8087
security:
  - bearerAuth: []
tags:
  - name: Configurations
  - name: Dashboard
  - name: Admin actions
paths:
  /api/v1/configurations:
    get:
      tags: [Configurations]
      summary: Lister tous les réglages (ADMIN)
      responses:
        '200':
          description: Liste des réglages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConfigurationResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/configurations/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,150}$' }
    get:
      tags: [Configurations]
      summary: Lire un réglage (ADMIN)
      responses:
        '200':
          description: Réglage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationResponse' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Configurations]
      summary: Créer ou mettre à jour un réglage (ADMIN, upsert)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigurationRequest' }
      responses:
        '200':
          description: Réglage enregistré
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationResponse' }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Configurations]
      summary: Supprimer un réglage (ADMIN)
      responses:
        '204': { description: Supprimé }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/dashboard/snapshots:
    get:
      tags: [Dashboard]
      summary: Consulter les statistiques (ADMIN)
      parameters:
        - { name: metricType, in: query, schema: { $ref: '#/components/schemas/MetricType' } }
        - { name: from, in: query, description: "periodStart >= from (ISO-8601)", schema: { type: string, format: date-time } }
        - { name: to, in: query, description: "periodEnd <= to (ISO-8601)", schema: { type: string, format: date-time } }
        - { name: page, in: query, schema: { type: integer, default: 0, minimum: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: Page de statistiques (tri par generatedAt décroissant)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotPage' }
    post:
      tags: [Dashboard]
      summary: Enregistrer une statistique calculée (ADMIN ou service interne)
      security:
        - bearerAuth: []
        - internalApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnapshotRequest' }
      responses:
        '201':
          description: Statistique créée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotResponse' }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/admin/users/{userId}/status:
    patch:
      tags: [Admin actions]
      summary: Activer / désactiver un compte (ADMIN)
      description: Appelle Identity Service puis journalise dans Audit Service (SUCCESS ou FAILURE).
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserStatusRequest' }
      responses:
        '200':
          description: Statut modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminActionResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
  /api/v1/admin/doctors/{doctorId}/verification:
    patch:
      tags: [Admin actions]
      summary: Valider / refuser un médecin (ADMIN)
      description: Appelle Doctor Directory Service puis journalise dans Audit Service (SUCCESS ou FAILURE).
      parameters:
        - { name: doctorId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DoctorVerificationRequest' }
      responses:
        '200':
          description: Vérification enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminActionResponse' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    internalApiKey: { type: apiKey, in: header, name: X-Internal-Api-Key }
  responses:
    Error:
      description: Erreur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    MetricType:
      type: string
      enum: [TOTAL_USERS, ACTIVE_USERS, NEW_REGISTRATIONS, TOTAL_DOCTORS, VERIFIED_DOCTORS, PENDING_DOCTOR_VERIFICATIONS, APPOINTMENTS_BOOKED, APPOINTMENTS_CANCELLED]
    ConfigurationRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, maxLength: 4000 }
        description: { type: string, maxLength: 500 }
    ConfigurationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        value: { type: string }
        description: { type: string }
        updatedBy: { type: string }
        updatedAt: { type: string, format: date-time }
    SnapshotRequest:
      type: object
      required: [metricType, periodStart, periodEnd, value]
      properties:
        metricType: { $ref: '#/components/schemas/MetricType' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        value: { type: number, format: double }
        details: { type: string, maxLength: 4000, description: "JSON texte libre. Jamais de donnée clinique." }
    SnapshotResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        metricType: { $ref: '#/components/schemas/MetricType' }
        periodStart: { type: string, format: date-time }
        periodEnd: { type: string, format: date-time }
        value: { type: number, format: double }
        details: { type: string }
        generatedAt: { type: string, format: date-time }
    SnapshotPage:
      type: object
      properties:
        content: { type: array, items: { $ref: '#/components/schemas/SnapshotResponse' } }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    UserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, DISABLED] }
    DoctorVerificationRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [VERIFIED, REJECTED] }
        reason: { type: string, maxLength: 500, description: "Motif administratif (jamais clinique)" }
    AdminActionResponse:
      type: object
      properties:
        action: { type: string, example: ACCOUNT_STATUS_CHANGED }
        resourceId: { type: string, format: uuid }
        newStatus: { type: string }
        performedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
