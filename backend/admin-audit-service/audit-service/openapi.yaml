openapi: 3.0.3
info:
  title: Clinic Copilot - Audit Service
  description: >
    Records and exposes security / administrative events for the platform.
    Never stores clinical content (symptoms, diagnoses, chat text, notes).
  version: 0.1.0
servers:
  - url: http://localhost:8086
    description: Local development
  - url: http://audit-service:8086
    description: Inside the Docker Compose network

tags:
  - name: Audit Logs

paths:
  /api/v1/audit-logs:
    post:
      tags: [Audit Logs]
      summary: Record one audit event
      description: >
        Called service-to-service (another backend service, or the
        Administration Service after it performs an admin action).
        Requires either the X-Internal-Api-Key header or an ADMIN JWT.
      security:
        - internalApiKey: []
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditLogRequest'
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid credentials
        '403':
          description: Authenticated but not authorized

    get:
      tags: [Audit Logs]
      summary: Search audit events (ADMIN only)
      security:
        - bearerAuth: [ ]
      parameters:
        - in: query
          name: actorId
          schema: { type: string, format: uuid }
        - in: query
          name: actorRole
          schema: { $ref: '#/components/schemas/ActorRole' }
        - in: query
          name: action
          schema: { type: string }
        - in: query
          name: resourceType
          schema: { type: string }
        - in: query
          name: resourceId
          schema: { type: string, format: uuid }
        - in: query
          name: result
          schema: { $ref: '#/components/schemas/AuditResult' }
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
        - in: query
          name: page
          schema: { type: integer, default: 0 }
        - in: query
          name: size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: A page of matching audit events
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogResponse'
                  totalElements: { type: integer }
                  totalPages: { type: integer }
                  number: { type: integer, description: current page index }
                  size: { type: integer }
        '401':
          description: Missing/invalid credentials
        '403':
          description: Authenticated but not ADMIN

  /api/v1/audit-logs/{id}:
    get:
      tags: [Audit Logs]
      summary: Get one audit event by id (ADMIN only)
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The audit event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    internalApiKey:
      type: apiKey
      in: header
      name: X-Internal-Api-Key

  schemas:
    ActorRole:
      type: string
      enum: [GUEST, PATIENT, DOCTOR, ADMIN, SYSTEM]

    AuditResult:
      type: string
      enum: [SUCCESS, FAILURE, DENIED]

    AuditLogRequest:
      type: object
      required: [actorId, actorRole, action, resourceType, result]
      properties:
        actorId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/ActorRole' }
        action: { type: string, example: DOCTOR_VERIFIED }
        resourceType: { type: string, example: DOCTOR_PROFILE }
        resourceId: { type: string, format: uuid, nullable: true }
        result: { $ref: '#/components/schemas/AuditResult' }
        metadata:
          type: string
          nullable: true
          description: Free-form JSON string. Never clinical content.

    AuditLogResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/ActorRole' }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, format: uuid, nullable: true }
        result: { $ref: '#/components/schemas/AuditResult' }
        timestamp: { type: string, format: date-time }
        metadata: { type: string, nullable: true }

    ApiError:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        details:
          type: array
          items: { type: string }
