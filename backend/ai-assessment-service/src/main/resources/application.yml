server:
  port: 8084

spring:
  application:
    name: ai-assessment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_ai}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health