server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: doctor-directory-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_doctors}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      roles-claim: ${JWT_ROLES_CLAIM:role}
  storage:
    diplomas-dir: ${DIPLOMAS_DIR:./data/diplomas}