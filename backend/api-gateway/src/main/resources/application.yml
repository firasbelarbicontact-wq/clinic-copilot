server:
  port: 8080

spring:
  application:
    name: api-gateway

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity-auth
              uri: http://identity-profile-service:8081
              predicates:
                - Path=/api/auth/**