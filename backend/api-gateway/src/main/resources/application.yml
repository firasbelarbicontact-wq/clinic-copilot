server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # First match wins : routes admin spécifiques avant le catch-all /api/admin/**
            - id: reviews-admin
              uri: ${REVIEWS_SERVICE_URL:${REVIEWS_URL:http://localhost:8088}}
              predicates:
                - Path=/api/admin/reviews/**

            - id: admin-audit
              uri: ${ADMIN_AUDIT_URL:http://localhost:8089}
              predicates:
                - Path=/api/admin/audit/**

            - id: doctor-directory-admin
              uri: ${DOCTOR_DIRECTORY_URL:${DOCTOR_URL:http://localhost:8082}}
              predicates:
                - Path=/api/admin/**

            # Identity & Users
            - id: identity-auth
              uri: ${IDENTITY_SERVICE_URL:${IDENTITY_URL:http://localhost:8081}}
              predicates:
                - Path=/api/auth/**

            - id: identity-users
              uri: ${IDENTITY_SERVICE_URL:${IDENTITY_URL:http://localhost:8081}}
              predicates:
                - Path=/api/users/**

            # Patients
            - id: patient-profiles
              uri: ${PATIENT_PROFILE_URL:${PATIENT_URL:http://localhost:8090}}
              predicates:
                - Path=/api/patient-profiles/**

            # Avis & Notations
            - id: reviews-doctor-reviews
              uri: ${REVIEWS_SERVICE_URL:${REVIEWS_URL:http://localhost:8088}}
              predicates:
                - Path=/api/doctors/{id}/reviews

            - id: reviews-doctor-rating
              uri: ${REVIEWS_SERVICE_URL:${REVIEWS_URL:http://localhost:8088}}
              predicates:
                - Path=/api/doctors/{id}/rating

            - id: reviews-public
              uri: ${REVIEWS_SERVICE_URL:${REVIEWS_URL:http://localhost:8088}}
              predicates:
                - Path=/api/reviews/**

            # Rendez-vous et disponibilités
            - id: appointments
              uri: ${APPOINTMENT_SERVICE_URL:${APPOINTMENT_URL:http://localhost:8084}}
              predicates:
                - Path=/api/appointments/**

            - id: availability
              uri: ${APPOINTMENT_SERVICE_URL:${APPOINTMENT_URL:http://localhost:8084}}
              predicates:
                - Path=/api/availability/**

            # Dossiers médicaux & consultations
            - id: medical-records
              uri: ${MEDICAL_RECORDS_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/consultations/**,/api/v1/medications/**

            # Annuaire des médecins
            - id: doctor-directory-public
              uri: ${DOCTOR_DIRECTORY_URL:${DOCTOR_URL:http://localhost:8082}}
              predicates:
                - Path=/api/directory/**

            - id: doctor-directory-specialties
              uri: ${DOCTOR_DIRECTORY_URL:${DOCTOR_URL:http://localhost:8082}}
              predicates:
                - Path=/api/specialties/**

            - id: doctor-directory-languages
              uri: ${DOCTOR_DIRECTORY_URL:${DOCTOR_URL:http://localhost:8082}}
              predicates:
                - Path=/api/languages/**

            - id: doctor-directory-doctors
              uri: ${DOCTOR_DIRECTORY_URL:${DOCTOR_URL:http://localhost:8082}}
              predicates:
                - Path=/api/doctors/**

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
