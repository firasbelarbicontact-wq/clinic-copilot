server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: patients
              uri: ${PATIENT_URL:http://localhost:8090}
              predicates:
                - Path=/api/patient-profiles/**
            - id: reviews
              uri: ${REVIEWS_URL:http://localhost:8088}
              predicates:
                - Path=/api/reviews/**,/api/admin/reviews/**,/api/doctors/{id}/reviews,/api/doctors/{id}/rating
            - id: doctors
              uri: ${DOCTOR_URL:http://localhost:8082}
              predicates:
                - Path=/api/doctors/**,/api/specialties,/api/languages,/api/directory/**,/api/admin/**
            - id: appointments
              uri: ${APPOINTMENT_URL:http://localhost:8084}
              predicates:
                - Path=/api/availability/**,/api/appointments/**
            # ai, chat, records, notifications, audit : même modèle, une fois les préfixes confirmés

management:
  endpoints:
    web:
      exposure:
        include: health,gateway