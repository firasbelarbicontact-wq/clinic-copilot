server:
  port: 8081

spring:
  application:
    name: identity-profile-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_identity}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health