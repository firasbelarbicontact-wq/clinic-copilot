server:
  port: 8081

spring:
  application:
    name: identity-profile-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_identity}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

services:
  patient-url: ${PATIENT_PROFILE_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
