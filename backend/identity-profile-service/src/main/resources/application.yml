server:
  port: 8081

spring:
  application:
    name: identity-profile-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_identity}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  secret: ${JWT_SECRET:9f7c2a8e4d1b6f03a5c9e2d7b8f1a604c3e9d6b2f7a0e5c8d1b4f9a6e3c7d205}

patient:
  service:
    url: ${PATIENT_SERVICE_URL:http://localhost:8090}

management:
  endpoints:
    web:
      exposure:
        include: health
