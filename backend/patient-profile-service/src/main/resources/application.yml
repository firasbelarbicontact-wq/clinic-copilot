server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: patient-profile-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_patients}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
