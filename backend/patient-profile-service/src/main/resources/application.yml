server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: patient-profile-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinic_patients}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      roles-claim: ${JWT_ROLES_CLAIM:role}

management:
  endpoints:
    web:
      exposure:
        include: health
