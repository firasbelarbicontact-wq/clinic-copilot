services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: audit_service_db
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_pass
    ports:
      - "5432:5432"
    volumes:
      - audit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d audit_service_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  audit-service:
    build: .
    ports:
      - "8086:8086"
    environment:
      JWT_SECRET: dev-secret-change-me-32-chars-min
      INTERNAL_API_KEY: dev-internal-key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  audit_pg_data: